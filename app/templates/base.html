<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}MAMI GROUP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #02000e;
      --glass: rgba(255,255,255,0.035);
      --glass-hi: rgba(255,255,255,0.065);
      --border: rgba(255,255,255,0.07);
      --border-hi: rgba(139,92,246,0.45);
      --purple: #8b5cf6; --purple-2: #a78bfa; --purple-dark: #6d28d9;
      --text: #f1f0ff; --muted: #7c7c9a; --line: rgba(255,255,255,0.06);
      --green: #10b981; --red: #ef4444; --orange: #f59e0b;
      --surface: rgba(255,255,255,0.035);
      --surface-2: rgba(255,255,255,0.055);
      --surface-3: rgba(255,255,255,0.075);
    }
    html { color-scheme: dark; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 80% -10%, rgba(109,40,217,.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 10% 90%, rgba(99,102,241,.14) 0%, transparent 60%);
      min-height: 100vh; color: var(--text);
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    .orb { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; animation:orb-drift 18s ease-in-out infinite; }
    .orb-1 { width:560px;height:560px;background:radial-gradient(circle,rgba(109,40,217,.18),transparent 70%);top:-180px;right:-160px;animation-delay:0s; }
    .orb-2 { width:440px;height:440px;background:radial-gradient(circle,rgba(99,102,241,.14),transparent 70%);bottom:-140px;left:-120px;animation-delay:-9s; }
    .orb-3 { width:280px;height:280px;background:radial-gradient(circle,rgba(167,139,250,.10),transparent 70%);top:50%;left:50%;animation-delay:-4s;animation-duration:24s; }
    @keyframes orb-drift { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-40px) scale(1.05)} 66%{transform:translate(-20px,25px) scale(.97)} }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(139,92,246,.3);border-radius:20px;border:1px solid rgba(255,255,255,.08); }
    ::-webkit-scrollbar-thumb:hover { background:rgba(139,92,246,.5); }
    nav {
      position:sticky;top:0;z-index:100;height:64px;
      display:flex;align-items:center;justify-content:space-between;padding:0 28px;
      background:rgba(2,0,14,.72);
      backdrop-filter:blur(24px) saturate(160%);
      -webkit-backdrop-filter:blur(24px) saturate(160%);
      border-bottom:1px solid rgba(139,92,246,.15);
      box-shadow:0 1px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03) inset;
    }
    .nav-brand { display:flex;align-items:center;text-decoration:none; }
    .brand-logo {
      height:36px;width:auto;object-fit:contain;
      filter:drop-shadow(0 0 12px rgba(139,92,246,.5));
      transition:filter .25s ease,transform .25s ease;
    }
    .nav-brand:hover .brand-logo { filter:drop-shadow(0 0 18px rgba(167,139,250,.7));transform:scale(1.04); }
    .nav-links { display:flex;align-items:center;gap:4px; }
    .nav-links a {
      color:rgba(241,240,255,.6);text-decoration:none;
      font-size:.84rem;font-weight:500;letter-spacing:.01em;
      padding:7px 14px;border-radius:8px;transition:color .2s,background .2s;
    }
    .nav-links a:hover { color:#fff;background:rgba(139,92,246,.12); }
    .main {
      position:relative;z-index:1;max-width:1140px;
      margin:32px auto;padding:0 20px 60px;
      animation:page-in .35s ease both;
    }
    @keyframes page-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    h1,h2,h3,h4,h5,h6,strong,b { color:#fff;font-weight:700; }
    .card {
      position:relative;
      background:var(--glass);
      backdrop-filter:blur(20px) saturate(140%);
      -webkit-backdrop-filter:blur(20px) saturate(140%);
      border:1px solid var(--border);border-radius:20px;
      padding:28px 30px;margin-bottom:20px;
      box-shadow:0 8px 32px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.05) inset;
      transition:border-color .25s ease,box-shadow .25s ease;
    }
    .card:hover {
      border-color:rgba(139,92,246,.28);
      box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(139,92,246,.06),0 1px 0 rgba(255,255,255,.07) inset;
    }
    .card-title { font-size:1rem;font-weight:700;letter-spacing:-.01em;margin-bottom:18px;color:#fff; }
    .muted,.label-note { color:var(--muted)!important; }
    .small { font-size:.8rem; }
    a.inline-link { color:var(--purple-2);font-weight:600;text-decoration:none; }
    a.inline-link:hover { color:#fff;text-decoration:underline; }
    .alert { padding:13px 16px;border-radius:12px;margin-bottom:16px;font-size:.88rem;line-height:1.6;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text); }
    .alert-success { border-left:3px solid var(--green);background:rgba(16,185,129,.06); }
    .alert-error   { border-left:3px solid var(--red);background:rgba(239,68,68,.06); }
    .alert-info    { border-left:3px solid var(--purple);background:rgba(139,92,246,.06); }
    .alert-warn    { border-left:3px solid var(--orange);background:rgba(245,158,11,.06); }
    label { display:block;font-size:.8rem;font-weight:600;letter-spacing:.03em;color:rgba(255,255,255,.7);margin-bottom:7px;text-transform:uppercase; }
    .field { margin-bottom:20px; }
    input[type=text],input[type=number],input[type=password],textarea,select {
      width:100%;padding:11px 14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;
      font-size:.9rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;
      font-family:inherit;background:rgba(255,255,255,.04);backdrop-filter:blur(8px);
    }
    input::placeholder,textarea::placeholder { color:rgba(124,124,154,.7); }
    input:focus,textarea:focus,select:focus { border-color:rgba(139,92,246,.6);box-shadow:0 0 0 3px rgba(139,92,246,.14);background:rgba(255,255,255,.06); }
    input[type=checkbox],input[type=radio] { accent-color:var(--purple); }
    textarea { resize:vertical;min-height:110px; }
    option { background:#12101e;color:#fff; }
    .btn { display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:10px;font-size:.85rem;font-weight:600;letter-spacing:.01em;cursor:pointer;border:none;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease,background .18s ease; }
    .btn:active { transform:scale(.97)!important; }
    .btn-primary,.btn-success { background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:0 4px 20px rgba(109,40,217,.35); }
    .btn-primary:hover,.btn-success:hover { transform:translateY(-1px);box-shadow:0 8px 28px rgba(109,40,217,.5);filter:brightness(1.1); }
    .btn-danger { background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3); }
    .btn-danger:hover { background:rgba(239,68,68,.25);transform:translateY(-1px); }
    .btn-outline { background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.15); }
    .btn-outline:hover { border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.1);transform:translateY(-1px); }
    .btn-gray { background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.08); }
    .btn-gray:hover { background:rgba(255,255,255,.12);transform:translateY(-1px); }
    .btn-block { width:100%;padding:13px;font-size:.95rem; }
    .steps { display:flex;gap:8px;margin-bottom:24px; }
    .step-dot { flex:1;height:3px;border-radius:4px;background:rgba(255,255,255,.08); }
    .step-dot.active,.step-dot.done { background:linear-gradient(90deg,var(--purple-dark),var(--purple-2)); }
    .table-wrap { width:100%;overflow-x:auto;border-radius:14px; }
    table { width:100%;border-collapse:collapse;font-size:.88rem; }
    th { background:rgba(139,92,246,.07);color:rgba(255,255,255,.45);padding:11px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap; }
    td { padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;color:rgba(241,240,255,.85); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,255,255,.02); }
    code { font-family:'SF Mono','Fira Code',monospace;font-size:.82rem;color:var(--purple-2); }
    .badge { display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.04em;white-space:nowrap; }
    .badge-green  { background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.2); }
    .badge-gray   { background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1); }
    .badge-blue,.badge-purple { background:rgba(139,92,246,.12);color:#c4b5fd;border:1px solid rgba(139,92,246,.2); }
    .badge-orange { background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.2); }
    .badge-red    { background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.2); }
    .stats-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }
    .stat { background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 20px;transition:border-color .2s,transform .2s; }
    .stat:hover { border-color:rgba(139,92,246,.25);transform:translateY(-1px); }
    .stat-label { color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px; }
    .stat-value { font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:#fff!important; }
    .account-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px; }
    .account-choice { position:relative;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s;background:rgba(255,255,255,.03); }
    .account-choice:hover { border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.07); }
    .account-choice:has(input:checked) { border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.1);box-shadow:0 0 0 1px rgba(139,92,246,.2) inset; }
    .account-choice input { position:absolute;top:15px;right:15px;width:16px;height:16px; }
    .progress { height:6px;background:rgba(255,255,255,.07);border-radius:20px;overflow:hidden; }
    .progress > div { height:100%;width:0;background:linear-gradient(90deg,var(--purple-dark),var(--purple-2));border-radius:20px;transition:width .4s ease;box-shadow:0 0 10px rgba(139,92,246,.4); }
    .upload-area { border:1.5px dashed rgba(255,255,255,.14);border-radius:12px;padding:22px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:rgba(255,255,255,.025); }
    .upload-area:hover { border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.06); }
    .upload-preview { max-width:100%;max-height:180px;border-radius:8px;margin-top:10px;display:none; }
    .md-hint { background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:.8rem;color:rgba(241,240,255,.6);line-height:1.8; }
    .md-hint code { background:rgba(139,92,246,.15);color:var(--purple-2);padding:1px 6px;border-radius:4px; }
    .flex { display:flex;align-items:center;gap:10px; }
    .flex-between { display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px; }
    .status-row-sending td { background:rgba(245,158,11,.05); }
    .status-row-sent    td { background:rgba(16,185,129,.05); }
    .status-row-failed  td { background:rgba(239,68,68,.05); }
    .status-row-skipped td { background:rgba(255,255,255,.02); }
    .status-row-paused  td { background:rgba(139,92,246,.05); }
    @media (max-width:760px) {
      nav { padding:0 16px; }
      .main { margin-top:20px; }
      .card { padding:20px 18px; }
      .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .account-grid { grid-template-columns:1fr; }
      .nav-links a { font-size:.78rem;padding:6px 10px; }
    }
  </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<nav>
  <a class="nav-brand" href="/dashboard">
    <img class="brand-logo"
         src="https://res.cloudinary.com/dzct9jxie/image/upload/v1784872660/MAMI_keopwr.png"
         alt="MAMI GROUP">
  </a>
  <div class="nav-links">
    <a href="/dashboard">Beranda</a>
    <a href="/blast">Blast</a>
    <a href="/scraper">Scraper TG</a>
    <a href="/wa">WhatsApp</a>
    <a href="/connect-telegram">Akun TG</a>
  </div>
</nav>
<div class="main">{% block content %}{% endblock %}</div>
<script>
function previewImage(input) {
  const area = input.closest('.upload-area');
  const preview = area.querySelector('.upload-preview');
  const text = area.querySelector('.upload-text');
  const icon = area.querySelector('.upload-icon');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      if (text) text.style.display = 'none';
      if (icon) icon.style.display = 'none';
    };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
