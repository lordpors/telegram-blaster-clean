<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#050116"><meta name="robots" content="noindex,nofollow">
  <title>Reset Password — PorsLabs</title><link rel="icon" type="image/png" href="https://res.cloudinary.com/dzct9jxie/image/upload/v1784961445/porslabs-icon_b5wko8.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/porslabs-app.css">
</head>
<body class="auth-page"><div class="auth-orb auth-orb-one"></div><div class="auth-orb auth-orb-two"></div>
<main class="auth-shell"><section class="auth-card">
  <div class="auth-brand"><img src="https://res.cloudinary.com/dzct9jxie/image/upload/v1784961209/porslabs_ru1ypk.png" alt="PorsLabs"><span>Telegram Blaster</span></div>
  <header class="auth-heading"><h1>Password Baru</h1><p>Buat password baru untuk mengamankan akun Anda.</p></header>
  {% if error %}<div class="auth-alert auth-alert-error" role="alert">{{ error }}</div>{% endif %}
  {% if token_valid %}
  <form class="auth-form" method="post" action="/reset-password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}">
    <div class="auth-field"><label for="password">Password Baru</label><div class="auth-input-wrap"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" name="password" placeholder="Minimal 8 karakter" minlength="8" maxlength="128" required autofocus><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Tampilkan password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div>
    <div class="auth-field"><label for="password_confirmation">Konfirmasi Password</label><div class="auth-input-wrap"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password_confirmation" type="password" name="password_confirmation" placeholder="Ulangi password" minlength="8" maxlength="128" required><button class="password-toggle" type="button" data-password-toggle="password_confirmation" aria-label="Tampilkan password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div>
    <button class="auth-submit" type="submit">Simpan Password <span>→</span></button>
  </form>
  {% else %}<div class="auth-alert auth-alert-error">Tautan reset tidak valid atau sudah kedaluwarsa.</div>{% endif %}
  <p class="auth-switch"><a href="/login">← Kembali ke Login</a></p>
</section><p class="auth-copyright">© <span id="copyright-year"></span> Dibuat oleh <a href="https://porslabs.com" target="_blank" rel="noopener noreferrer">PorsLabs.com</a></p></main>
<script src="/static/js/porslabs-app.js"></script></body></html>
