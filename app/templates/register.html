<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050116"><meta name="robots" content="noindex,nofollow">
  <title>Daftar — PorsLabs Telegram Blaster</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dzct9jxie/image/upload/v1784961445/porslabs-icon_b5wko8.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/porslabs-app.css">
</head>
<body class="auth-page">
<div class="auth-orb auth-orb-one"></div><div class="auth-orb auth-orb-two"></div>
<main class="auth-shell auth-shell-wide">
  <section class="auth-card" aria-labelledby="register-title">
    <div class="auth-brand"><img src="https://res.cloudinary.com/dzct9jxie/image/upload/v1784961209/porslabs_ru1ypk.png" alt="PorsLabs"><span>Telegram Blaster</span></div>
    <header class="auth-heading"><h1 id="register-title">Buat Akun Baru</h1><p>Mulai dengan workspace privat milik Anda sendiri.</p></header>
    {% if error %}<div class="auth-alert auth-alert-error" role="alert">{{ error }}</div>{% endif %}
    <form class="auth-form" method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="auth-field"><label for="username">Username</label><div class="auth-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><input id="username" type="text" name="username" value="{{ values.get('username', '') }}" placeholder="Pilih username" autocomplete="username" minlength="3" maxlength="32" required autofocus></div></div>
      <div class="auth-field"><label for="email">Email</label><div class="auth-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="email" type="email" name="email" value="{{ values.get('email', '') }}" placeholder="nama@email.com" autocomplete="email" maxlength="320" required></div></div>
      <div class="auth-field"><label for="password">Password</label><div class="auth-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" name="password" placeholder="Minimal 8 karakter" autocomplete="new-password" minlength="8" maxlength="128" required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Tampilkan password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div>
      <div class="auth-field"><label for="password_confirmation">Konfirmasi Password</label><div class="auth-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password_confirmation" type="password" name="password_confirmation" placeholder="Ulangi password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="password-toggle" type="button" data-password-toggle="password_confirmation" aria-label="Tampilkan password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div>
      <button class="auth-submit" type="submit">Daftar Sekarang <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">Sudah punya akun? <a href="/login">Login</a></p>
  </section>
  <p class="auth-copyright">© <span id="copyright-year"></span> Dibuat oleh <a href="https://porslabs.com" target="_blank" rel="noopener noreferrer">PorsLabs.com</a></p>
</main>
<script src="/static/js/porslabs-app.js"></script>
</body>
</html>
